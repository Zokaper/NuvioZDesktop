# Release ordering serial for the desktop app.
#
# THIS, NOT THE VERSION STRING, IS WHAT ORDERS RELEASES.
#
# Nuvio Z is a mod: a Nuvio Z version is a vanilla version plus a Z revision
# (0.6.0-z1, then -z2, resetting when the base moves). That number can go
# BACKWARDS by name - adopting vanilla's numbering means our first mod release
# is 0.4.9-z1 while installs are sitting on 0.4.14-beta - and the old updater
# refused anything numerically lower, so it could never have been offered.
#
# Bump this by exactly one for every published release, stable or debug. It is
# published in the tag rather than as an asset:
#
#     v0.6.0-z1+127          stable
#     debug-v0.6.0-z1.3+128  debug channel
#
# The updater already reads tag_name, so this costs no extra request. VersionUtils
# compares on the serial when both sides have one and falls back to the old string
# comparison when either does not, so every pre-bridge release stays orderable and
# no installed build is stranded.
#
# The mobile repository keeps the same counter in
# iosApp/Configuration/ReleaseSerial.xcconfig, and the two must stay in step: the
# serial identifies a RELEASE, and the two apps ship one version name between them.
#
# Its own file, for the same reason DEBUG_BUILD is: scripts/release-metadata.sh
# reads any commit touching the version file as a release bump and generates notes
# across previous_bump..current_bump, so a serial-only commit between two releases
# would silently truncate the next release's notes.
RELEASE_SERIAL=125
