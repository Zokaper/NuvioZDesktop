# Debug-channel build counter for the desktop app.
#
# Bump this for every debug MSI published to the debug update channel. It is what
# makes an installed debug build see a newer one: the marketing version stays put
# while a debug line runs, so without this counter every debug MSI cut from one
# release version looks identical to the installed one and no update is offered.
#
# It produces a fourth version component (0.4.14-beta.3), the tag
# debug-v0.4.14-beta.3, and an MSI ProductVersion of 1.<VERSION_CODE>.<DEBUG_BUILD>.
#
# DELIBERATELY NOT IN DesktopVersion.properties, even though the mobile repository
# keeps its DEBUG_BUILD in Version.xcconfig. scripts/release-metadata.sh finds a
# release bump by walking the commits that touch the *version file* and reading
# VERSION_NAME at each one - it does not require the value to have changed. A
# commit that only moved the debug counter would therefore be treated as the
# previous bump, and release notes are generated across previous_bump..current_bump,
# so publishing a debug build between two releases would silently truncate the next
# release's notes to the commits after it. A separate file cannot do that.
#
# Ignored entirely unless the build is made with -Pnuvio.desktop.debugChannel=true.
DEBUG_BUILD=34
