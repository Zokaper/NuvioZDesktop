name: Desktop debug release

# Publishes Windows x64 and macOS arm64 packages to the desktop debug update
# channel. The release updater rejects the `debug-v*` tag prefix, so this line
# cannot be mistaken for a production release.
#
# `-Pnuvio.desktop.debugChannel=true` makes this a separate application:
# "Nuvio Z Debug", with its own Windows upgrade UUID, macOS bundle ID and data
# directory. The macOS debug package is deliberately unsigned until this
# repository has Apple Developer signing and notarisation credentials.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-debug-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve debug version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Resolve and reserve debug version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          config=composeApp/Configuration/DesktopVersion.properties
          debug_config=composeApp/Configuration/DesktopDebugVersion.properties
          read_value() {
            sed -nE "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*([^[:space:]#]+).*/\1/p" "$1" | head -1
          }
          version_name="$(read_value "${config}" VERSION_NAME)"
          version_code="$(read_value "${config}" VERSION_CODE)"
          debug_build="$(read_value "${debug_config}" DEBUG_BUILD)"
          if [[ -z "${version_name}" || -z "${version_code}" || -z "${debug_build}" ]]; then
            echo "::error::Could not read desktop release/debug version metadata."
            exit 1
          fi
          version="${version_name}.${debug_build}"
          tag="debug-v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Building ${tag} (expected MSI ProductVersion 1.${version_code}.${debug_build})"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists. Bump DEBUG_BUILD and dispatch again."
            exit 1
          fi

  windows:
    name: Windows x64 debug package
    needs: metadata
    runs-on: windows-2022
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Fetch Windows runtime from Git LFS
        shell: bash
        run: |
          git lfs pull \
            --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe" \
            --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]] || (( $(wc -c < "${runtime_path}") < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cap Gradle memory for hosted runners
        shell: bash
        run: |
          mkdir -p "${HOME}/.gradle"
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
            echo 'kotlin.daemon.jvmargs=-Xmx3g'
          } >> "${HOME}/.gradle/gradle.properties"
      - name: Configure runtime properties
        shell: bash
        run: |
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "::warning::Building without backend configuration."
            : > local.properties
            exit 0
          fi
          normalise_b64() { printf '%s' "$1" | tr '_-' '/+' | LC_ALL=C tr -cd 'A-Za-z0-9+/='; }
          looks_like_properties() {
            printf '%s' "$1" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=' \
              && printf '%s' "$1" | LC_ALL=C grep -q '[:.]'
          }
          if looks_like_properties "${LOCAL_PROPERTIES_BASE64}"; then
            printf '%s\n' "${LOCAL_PROPERTIES_BASE64}" > local.properties
          else
            normalise_b64 "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          fi
          if ! grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.' local.properties; then
            echo "NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 did not yield a properties file." >&2
            exit 1
          fi
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"))) {
            throw "WebView2Loader.dll.lib was not found under $webView2Root"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # The full desktop suite runs on Ubuntu in ci.yml. Its deliberately slow
      # faulty-server tests are not stable on the Windows hosted runner.
      - name: Build debug MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.desktop.debugChannel=true" `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --console=plain 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Debug MSI build failed"
            Select-String -Path build.log -Pattern '^e: ' | Select-Object -First 60 | ForEach-Object { $_.Line }
            exit 1
          }
      - name: Verify MSI artifact
        shell: pwsh
        env:
          DEBUG_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $expected = "composeApp\build\compose\release-msis\Nuvio-Z-Debug-Windows-x64-$env:DEBUG_VERSION.msi"
          if (-not (Test-Path $expected)) {
            Write-Output "::error::Expected debug MSI was not produced: $expected"
            Get-ChildItem "composeApp\build\compose\release-msis" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output "found instead: $($_.Name)" }
            exit 1
          }
      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: desktop-debug-windows-x64
          path: composeApp/build/compose/release-msis/Nuvio-Z-Debug-Windows-x64-${{ needs.metadata.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64 debug package
    needs: metadata
    runs-on: macos-15
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      MACOS_ARCH: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Fetch and verify macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull \
            --include="composeApp/src/desktopMain/native/macos/runtime/${MACOS_ARCH}/**" \
            --exclude=""
          runtime="composeApp/src/desktopMain/native/macos/runtime/${MACOS_ARCH}/libmpv.2.dylib"
          torrserver="composeApp/src/desktopMain/torrserver/macos-arm64/TorrServer"
          if [[ ! -f "${runtime}" ]] || (( $(wc -c < "${runtime}") < 1000000 )); then
            echo "The arm64 macOS libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi
          if [[ ! -f "${torrserver}" ]] || (( $(wc -c < "${torrserver}") < 1000000 )); then
            echo "The arm64 macOS TorrServer executable is missing." >&2
            exit 1
          fi
          file "${runtime}" "${torrserver}" | tee macos-source-architectures.txt
          if grep -v 'arm64' macos-source-architectures.txt; then
            echo "A required macOS runtime binary is not arm64." >&2
            exit 1
          fi
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cap Gradle memory for the arm64 runner
        shell: bash
        run: |
          mkdir -p "${HOME}/.gradle"
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
            echo 'kotlin.daemon.jvmargs=-Xmx2g'
          } >> "${HOME}/.gradle/gradle.properties"
      - name: Configure runtime properties
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "::warning::Building without backend configuration."
            : > local.properties
            exit 0
          fi
          normalise_b64() { printf '%s' "$1" | tr '_-' '/+' | LC_ALL=C tr -cd 'A-Za-z0-9+/='; }
          looks_like_properties() {
            printf '%s' "$1" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=' \
              && printf '%s' "$1" | LC_ALL=C grep -q '[:.]'
          }
          if looks_like_properties "${LOCAL_PROPERTIES_BASE64}"; then
            printf '%s\n' "${LOCAL_PROPERTIES_BASE64}" > local.properties
          else
            normalise_b64 "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          fi
          if ! grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.' local.properties; then
            echo "NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 did not yield a properties file." >&2
            exit 1
          fi
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties
      - name: Run desktop tests on macOS
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :composeApp:desktopTest \
            -Pnuvio.desktop.debugChannel=true \
            -Pnuvio.macos.arch="${MACOS_ARCH}" \
            --no-configuration-cache \
            --no-daemon \
            --console=plain 2>&1 | tee macos-tests.log
      - name: Build unsigned debug DMG
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseDmg \
            -Pnuvio.desktop.debugChannel=true \
            -Pnuvio.macos.arch="${MACOS_ARCH}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --console=plain 2>&1 | tee macos-package.log
      - name: Verify mounted macOS application
        shell: bash
        env:
          DEBUG_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          dmg="composeApp/build/compose/release-dmgs/Nuvio-Z-Debug-macOS-${MACOS_ARCH}-${DEBUG_VERSION}.dmg"
          if [[ ! -f "${dmg}" ]]; then
            echo "Expected debug DMG was not produced: ${dmg}" >&2
            find composeApp/build/compose -type f -name '*.dmg' -print || true
            exit 1
          fi
          hdiutil verify "${dmg}"
          mount_dir="${RUNNER_TEMP}/nuvio-debug-dmg"
          mkdir -p "${mount_dir}"
          hdiutil attach "${dmg}" -readonly -nobrowse -mountpoint "${mount_dir}"
          cleanup() { hdiutil detach "${mount_dir}" -force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          app="${mount_dir}/Nuvio Z Debug.app"
          plist="${app}/Contents/Info.plist"
          if [[ ! -d "${app}" || ! -f "${plist}" ]]; then
            echo "Nuvio Z Debug.app is missing from the DMG." >&2
            find "${mount_dir}" -maxdepth 3 -print
            exit 1
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${plist}")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${plist}")"
          if [[ "${bundle_id}" != 'com.nuvio.media.z.desktop.debug' ]]; then
            echo "Unexpected macOS debug bundle ID: ${bundle_id}" >&2
            exit 1
          fi
          file "${app}/Contents/MacOS/${executable}" | tee macos-package-architectures.txt
          if ! grep -q 'arm64' macos-package-architectures.txt; then
            echo "The packaged launcher is not arm64." >&2
            exit 1
          fi
          bridge="$(find "${app}" -type f -name libplayer_bridge.dylib -print -quit)"
          libmpv="$(find "${app}" -type f -name libmpv.2.dylib -print -quit)"
          if [[ -z "${bridge}" || -z "${libmpv}" ]]; then
            echo "The packaged native player bridge or libmpv runtime is missing." >&2
            find "${app}/Contents" -type f -name '*.dylib' -print || true
            exit 1
          fi
          file "${bridge}" "${libmpv}" | tee -a macos-package-architectures.txt
          if grep -v 'arm64' macos-package-architectures.txt; then
            echo "A packaged native player binary is not arm64." >&2
            exit 1
          fi
          otool -L "${bridge}" | tee macos-player-dependencies.txt
          if grep -E '/(opt/homebrew|usr/local|Users|private/var)/' macos-player-dependencies.txt; then
            echo "The player bridge contains a build-machine-only library path." >&2
            exit 1
          fi
          torrserver_found=false
          while IFS= read -r -d '' jar_path; do
            if jar tf "${jar_path}" | grep -Fx 'torrserver/macos-arm64/TorrServer' >/dev/null; then
              torrserver_found=true
              break
            fi
          done < <(find "${app}/Contents/app" -type f -name '*.jar' -print0)
          if [[ "${torrserver_found}" != true ]]; then
            echo "The packaged app does not contain the arm64 TorrServer resource." >&2
            exit 1
          fi
          shasum -a 256 "${dmg}" | tee macos-dmg-sha256.txt
          "${app}/Contents/MacOS/${executable}" > macos-launch.log 2>&1 &
          app_pid=$!
          sleep 15
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            echo "The packaged app exited during the launch smoke test." >&2
            cat macos-launch.log
            exit 1
          fi
          kill "${app_pid}" 2>/dev/null || true
          wait "${app_pid}" 2>/dev/null || true
      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-debug-macos-arm64-diagnostics
          path: |
            macos-*.log
            macos-*.txt
            composeApp/build/reports/tests/desktopTest/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: desktop-debug-macos-arm64
          path: composeApp/build/compose/release-dmgs/Nuvio-Z-Debug-macOS-arm64-${{ needs.metadata.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish desktop debug prerelease
    needs: [metadata, windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-debug-*
          path: release-assets
          merge-multiple: true
      - name: Publish to the debug channel
        shell: bash
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          msi="release-assets/Nuvio-Z-Debug-Windows-x64-${VERSION}.msi"
          dmg="release-assets/Nuvio-Z-Debug-macOS-arm64-${VERSION}.dmg"
          for package in "${msi}" "${dmg}"; do
            if [[ ! -f "${package}" ]]; then
              echo "Missing verified package: ${package}" >&2
              find release-assets -maxdepth 2 -type f -print
              exit 1
            fi
          done
          gh release create "${TAG}" "${msi}" "${dmg}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Desktop debug ${VERSION}" \
            --prerelease \
            --notes "Desktop debug build from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`.

          Includes Windows x64 and Apple Silicon macOS packages. Both install as
          **Nuvio Z Debug**, beside the release app, and update from this debug channel only.

          The macOS DMG is an unsigned test build. After copying the app to Applications,
          use **System Settings → Privacy & Security → Open Anyway** if Gatekeeper blocks
          the first launch.

          Not a production release. The release updater rejects the \`debug-\` tag prefix."
          echo "Published ${TAG} with Windows x64 and macOS arm64 packages."
